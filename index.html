<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posta Fácil AI – Mural de lojas</title>
<style>
:root{--bg:#eef1f5;--ink:#14213d;--muted:#5b6678;--board:#ffffff;--frame:#1b2b4b;--slot:#2d4068;--line:#d9dee6;--accent:#0b6bff;--panel:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--ink:#e8edf5;--muted:#9aa6b8;--board:#1a212c;--frame:#080b10;--slot:#1c2635;--line:#2b3442;--accent:#4d93ff;--panel:#1a212c}}
:root[data-theme="dark"]{--bg:#10151d;--ink:#e8edf5;--muted:#9aa6b8;--board:#1a212c;--frame:#080b10;--slot:#1c2635;--line:#2b3442;--accent:#4d93ff;--panel:#1a212c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.stat{color:var(--muted);font-size:13px;flex:1;min-width:140px}
.btns{display:flex;gap:6px}
button,a.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:focus-visible,a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sheet{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#sheet h2{margin:0 0 4px;font-size:17px}
#sheet p{margin:4px 0 10px;color:var(--muted);font-size:14px;line-height:1.4}
#sheet .row{display:flex;gap:8px;align-items:center}
#x{margin-left:auto}
#toast{position:fixed;z-index:9;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:300px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);transform:translateY(28px);opacity:0;pointer-events:none;transition:transform .5s ease,opacity .5s ease}
#toast.on{transform:none;opacity:1}
#toast small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:560px){body.sheet-open #toast{display:none}}
#rank{position:absolute;z-index:5;top:10px;right:12px;width:min(300px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none}
#rank.on{display:block}
#rank h2{font-size:15px;margin:0 0 8px}
#rank ol{margin:0;padding:0;list-style:none}
#rank li button{width:100%;text-align:left;display:flex;gap:8px;align-items:center;border:0;background:none;padding:7px 4px;border-radius:6px;font-size:14px}
#rank li button:hover{background:var(--bg)}
#rank .pos{width:20px;font-weight:700;color:var(--accent)}
#rank .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rank .ct{color:var(--muted);font-size:12px}
#rank p{margin:0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Posta Fácil AI</h1>
  <div class="stat" id="stat"></div>
  <div class="btns">
    <button id="hot" aria-expanded="false">🔥 Mais clicadas</button>
    <button id="zo" aria-label="Diminuir zoom">−</button>
    <button id="zi" aria-label="Aumentar zoom">+</button>
    <button id="zr">Ver tudo</button>
  </div>
</header>
<main>
  <canvas id="c" aria-label="Mural de blocos. Arraste para mover, use a roda ou pinça para dar zoom."></canvas>
  <aside id="rank" aria-label="Ofertas mais clicadas hoje"><h2>🔥 Ofertas mais clicadas hoje</h2><ol id="rl"></ol><p id="re">Ainda sem cliques hoje. Visite uma loja para abrir o ranking.</p></aside>
  <div id="sheet" role="dialog" aria-live="polite">
    <h2 id="sh"></h2><p id="sp"></p>
    <div class="row"><a class="btn primary" id="sa" target="_blank" rel="noopener"></a><button id="x">Fechar</button></div>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// ===== CONFIGURAÇÃO (edite aqui) =====
var WHATSAPP = "5562998309271";   // seu número com DDI+DDD
var PRECO = 5;                    // R$ por bloco/mês (exemplo)
var N = 100, C = 10;
var B = 8, T = N + 2*B;          // moldura de 8 blocos em volta
var PRECO_TOPO = 1500;           // R$ por semana, placas 1 a 4 (exemplo)
var PRECO_LADOS = 1100;          // R$ por semana, placas 5 a 12 (exemplo)
var SLOTS = [];(function(){var id=1,i;function add(x,y,w,h){SLOTS.push({id:id++,x:x,y:y,w:w,h:h,ad:null})}
  for(i=0;i<4;i++)add(i*T/4,0,T/4,B);                       // topo 1-4
  add(N+B,B,B,N/2);add(N+B,B+N/2,B,N/2);                    // direita 5-6
  for(i=0;i<4;i++)add(i*T/4,N+B,T/4,B);                     // base 7-10
  add(0,B,B,N/2);add(0,B+N/2,B,N/2)})();                    // esquerda 11-12              // 100x100 blocos, 10px cada = 1000x1000
var SUPABASE_URL = "https://ycjgabnmnrzikziotfin.supabase.co";
var SUPABASE_KEY = "sb_publishable_Eo04mkG2ZK-Z31m9HLyDFQ_up9gCiNs"; // chave pública
var ADS = [];
// ===== FIM DA CONFIGURAÇÃO =====
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var $=function(i){return document.getElementById(i)};
var s=1,tx=0,ty=0,minS=.3,dpr=window.devicePixelRatio||1,hover=null,pts={},drag=null,pinch=null;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function adAt(cx,cy){for(var i=0;i<ADS.length;i++){var a=ADS[i];if(cx>=a.x&&cx<a.x+a.w&&cy>=a.y&&cy<a.y+a.h)return a}return null}
function stat(){var u=0;ADS.forEach(function(a){u+=a.w*a.h});$("stat").textContent=(N*N-u).toLocaleString("pt-BR")+" blocos livres de "+(N*N).toLocaleString("pt-BR")+" · R$ "+PRECO+"/bloco por mês"}
function fit(){var r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;minS=Math.min(r.width,r.height)/(T*C)*.95;s=minS;tx=(r.width-T*C*s)/2;ty=(r.height-T*C*s)/2;draw()}
function clamp(){var r=cv.getBoundingClientRect(),w=T*C*s;
  tx=w<r.width?(r.width-w)/2:Math.min(0,Math.max(r.width-w,tx));ty=w<r.height?(r.height-w)/2:Math.min(0,Math.max(r.height-w,ty))}
function zoomAt(f,px,py){var ns=Math.min(40,Math.max(minS,s*f));f=ns/s;tx=px-(px-tx)*f;ty=py-(py-ty)*f;s=ns;clamp();draw()}
function draw(){
  var r=cv.getBoundingClientRect();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*tx,dpr*ty);
  ctx.fillStyle=css("--frame");ctx.fillRect(0,0,T*C,T*C);
  SLOTS.forEach(function(q){var X=q.x*C,Y=q.y*C,W=q.w*C,H=q.h*C,a=q.ad,t=a?a.n:"Seu logo aqui",v=q.h>q.w;
    ctx.fillStyle=a?a.c:css("--slot");ctx.fillRect(X+2,Y+2,W-4,H-4);
    ctx.save();ctx.translate(X+W/2,Y+H/2);if(v)ctx.rotate(-Math.PI/2);
    var L=v?H:W,M=v?W:H,fs=Math.min(M*.4,L/(t.length*.6),28);
    if(fs*s>=5){ctx.fillStyle=a?"#fff":"#c9d3e6";ctx.font="700 "+fs+"px Trebuchet MS,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t,0,0)}
    ctx.restore();
    if(hover&&hover.sl===q){ctx.strokeStyle=css("--accent");ctx.lineWidth=3/s;ctx.strokeRect(X+2,Y+2,W-4,H-4)}});
  ctx.translate(B*C,B*C);
  ctx.fillStyle=css("--board");ctx.fillRect(0,0,N*C,N*C);
  if(s*C>=5){ctx.strokeStyle=css("--line");ctx.lineWidth=1/s;ctx.beginPath();
    for(var i=0;i<=N;i++){ctx.moveTo(i*C,0);ctx.lineTo(i*C,N*C);ctx.moveTo(0,i*C);ctx.lineTo(N*C,i*C)}ctx.stroke()}
  ADS.forEach(function(a){var X=a.x*C,Y=a.y*C,W=a.w*C,H=a.h*C;ctx.fillStyle=a.c;ctx.fillRect(X,Y,W,H);
    var fs=Math.min(H*.3,W/(a.n.length*.58),26);if(fs*s>=6){ctx.fillStyle="#fff";ctx.font="700 "+fs+"px Trebuchet MS,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(a.n,X+W/2,Y+H/2)}});
  if(hover&&!hover.sl){var a=adAt(hover.x,hover.y);ctx.strokeStyle=css("--accent");ctx.lineWidth=2/s;
    if(a)ctx.strokeRect(a.x*C,a.y*C,a.w*C,a.h*C);else{ctx.fillStyle="rgba(11,107,255,.25)";ctx.fillRect(hover.x*C,hover.y*C,C,C);ctx.strokeRect(hover.x*C,hover.y*C,C,C)}}
}
function cellAt(px,py){var wx=(px-tx)/s/C,wy=(py-ty)/s/C;if(wx<0||wy<0||wx>=T||wy>=T)return null;
  var x=Math.floor(wx)-B,y=Math.floor(wy)-B;if(x>=0&&y>=0&&x<N&&y<N)return{x:x,y:y};
  for(var i=0;i<SLOTS.length;i++){var q=SLOTS[i];if(wx>=q.x&&wx<q.x+q.w&&wy>=q.y&&wy<q.y+q.h)return{sl:q}}return null}
function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
var curAd=null;
function openSlot(q){var a=q.ad,sa=$("sa");curAd=null;
  if(a){$("sh").textContent=a.n;$("sp").textContent=a.d+" Patrocinador master. Ativo até "+a.v+".";sa.textContent="Visitar site";sa.href=a.l}
  else{$("sh").textContent="Placa de patrocinador "+q.id;$("sp").textContent="Espaço master em destaque ao redor do mural, para grandes marcas. R$ "+(q.id<=4?PRECO_TOPO:PRECO_LADOS).toLocaleString("pt-BR")+" por semana, com renovação a cada 7 dias.";sa.textContent="Quero esta placa";sa.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Quero a placa de patrocinador "+q.id+" no mural Posta Fácil AI")}
  $("sheet").style.display="block";document.body.classList.add("sheet-open")}
function openSheet(c){if(c.sl)return openSlot(c.sl);var a=adAt(c.x,c.y),sa=$("sa");curAd=a;
  if(a){$("sh").textContent=a.n;$("sp").textContent=a.d+" Anúncio ativo até "+a.v+".";sa.textContent="Visitar loja";sa.href=a.l}
  else{$("sh").textContent="Bloco livre ("+(c.x+1)+", "+(c.y+1)+")";$("sp").textContent="Reserve este espaço por R$ "+PRECO+" por mês e apareça aqui com sua loja.";
    sa.textContent="Reservar no WhatsApp";sa.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Quero reservar o bloco ("+(c.x+1)+","+(c.y+1)+") no mural Posta Fácil AI")}
  $("sheet").style.display="block";document.body.classList.add("sheet-open")}
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]=pos(e);var k=Object.keys(pts);
  if(k.length===1)drag={sx:pts[k[0]].x,sy:pts[k[0]].y,ox:tx,oy:ty,moved:false};
  else if(k.length===2){drag=null;var a=pts[k[0]],b=pts[k[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:s}}});
cv.addEventListener("pointermove",function(e){var p=pos(e);
  if(pts[e.pointerId])pts[e.pointerId]=p;var k=Object.keys(pts);
  if(k.length===2&&pinch){var a=pts[k[0]],b=pts[k[1]],d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.s*d/pinch.d/s,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(drag&&k.length===1){var dx=p.x-drag.sx,dy=p.y-drag.sy;if(Math.abs(dx)+Math.abs(dy)>12)drag.moved=true;
    if(drag.moved){tx=drag.ox+dx;ty=drag.oy+dy;clamp();draw()}}
  else if(!k.length){hover=cellAt(p.x,p.y);draw()}});
function up(e){var p=pos(e);delete pts[e.pointerId];
  if(drag&&!drag.moved&&!pinch){var c=cellAt(p.x,p.y);if(c)openSheet(c)}
  if(!Object.keys(pts).length){drag=null;pinch=null}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",function(e){delete pts[e.pointerId];drag=null;pinch=null});
cv.addEventListener("wheel",function(e){e.preventDefault();var p=pos(e);zoomAt(e.deltaY<0?1.15:1/1.15,p.x,p.y)},{passive:false});
function mid(){var r=cv.getBoundingClientRect();return[r.width/2,r.height/2]}
$("zi").onclick=function(){var m=mid();zoomAt(1.5,m[0],m[1])};
$("zo").onclick=function(){var m=mid();zoomAt(1/1.5,m[0],m[1])};
$("zr").onclick=fit;
$("x").onclick=function(){$("sheet").style.display="none";document.body.classList.remove("sheet-open")};
window.addEventListener("resize",fit);
function safe(l){return/^https?:\/\//i.test(l||"")?l:"#"}
function br(d){var p=(d||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d}
var UF={};[["SP",[11,12,13,14,15,16,17,18,19]],["RJ",[21,22,24]],["ES",[27,28]],["MG",[31,32,33,34,35,37,38]],["PR",[41,42,43,44,45,46]],["SC",[47,48,49]],["RS",[51,53,54,55]],["DF",[61]],["GO",[62,64]],["TO",[63]],["MT",[65,66]],["MS",[67]],["AC",[68]],["RO",[69]],["BA",[71,73,74,75,77]],["SE",[79]],["PE",[81,87]],["AL",[82]],["PB",[83]],["RN",[84]],["CE",[85,88]],["PI",[86,89]],["PA",[91,93,94]],["AM",[92,97]],["RR",[95]],["AP",[96]],["MA",[98,99]]].forEach(function(g){g[1].forEach(function(d){UF[d]=g[0]})});
var seen={},fresh=[],recent=[],started=false;
function map(rows){return rows.map(function(a){return{id:a.id,x:a.x,y:a.y,w:a.w,h:a.h,n:a.nome,d:a.descricao||"",l:safe(a.link),c:a.cor||"#0b6bff",v:br(a.vencimento),uf:(a.estado||"").toUpperCase().slice(0,2)||UF[a.ddd]||""}})}
function num(a){return"#"+String(a.y*N+a.x+1).padStart(5,"0")}
function toast(a){var t=$("toast"),n=a.w*a.h,s=document.createElement("small"),b=document.createElement("b");
  s.textContent=n===1?"Bloco "+num(a):n+" blocos a partir do "+num(a);b.textContent=a.n+(a.uf?" · "+a.uf:"");
  t.innerHTML="";t.appendChild(s);t.appendChild(b);t.style.borderLeftColor=a.c;t.classList.add("on");
  setTimeout(function(){t.classList.remove("on")},5000)}
function tick(){var i=tick.i||0,a=fresh.shift()||recent[i%Math.max(recent.length,1)];if(a){toast(a);tick.i=i+1}setTimeout(tick,9000)}
function load(first){
  fetch(SUPABASE_URL+"/rest/v1/anunciantes?select=*&order=criado_em.desc",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(rows){ADS=map(rows);ADS.forEach(function(a){if(!seen[a.id]){seen[a.id]=1;if(!first)fresh.push(a)}});recent=ADS.slice(0,5);stat();draw();loadRank();loadSp();
    if(first&&!started){started=true;setTimeout(tick,2500)}})
  .catch(function(){if(first)$("stat").textContent="Não foi possível carregar os anunciantes. Tente recarregar a página."});
}
function hdr(){return{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"}}
function drawRank(rows){var ol=$("rl"),n=0;ol.innerHTML="";
  (rows||[]).forEach(function(r){var a=ADS.filter(function(x){return x.id===r.anunciante_id})[0];if(!a||n>=5)return;n++;
    var li=document.createElement("li"),b=document.createElement("button"),p=document.createElement("span"),m=document.createElement("span"),c=document.createElement("span");
    p.className="pos";p.textContent=n;m.className="nm";m.textContent=a.n+(a.uf?" · "+a.uf:"");c.className="ct";c.textContent=r.cliques+(r.cliques==1?" clique":" cliques");
    b.appendChild(p);b.appendChild(m);b.appendChild(c);b.onclick=function(){focusAd(a);if(innerWidth<900)$("rank").classList.remove("on")};li.appendChild(b);ol.appendChild(li)});
  $("re").style.display=n?"none":"block"}
function loadRank(){fetch(SUPABASE_URL+"/rest/v1/rpc/ranking_hoje",{method:"POST",headers:hdr(),body:"{}"})
  .then(function(r){return r.ok?r.json():[]}).then(drawRank).catch(function(){})}
function track(id){var k="pf_c_"+id+"_"+new Date().toLocaleDateString("sv");
  try{if(localStorage.getItem(k))return;localStorage.setItem(k,"1")}catch(e){}
  fetch(SUPABASE_URL+"/rest/v1/rpc/registrar_clique",{method:"POST",keepalive:true,headers:hdr(),body:JSON.stringify({p_id:id})}).catch(function(){});
  setTimeout(loadRank,1500)}
function loadSp(){fetch(SUPABASE_URL+"/rest/v1/patrocinadores?select=*",{headers:hdr()})
  .then(function(r){return r.ok?r.json():[]}).then(function(rows){SLOTS.forEach(function(q){q.ad=null});
    rows.forEach(function(a){var q=SLOTS[a.slot-1];if(q)q.ad={n:a.nome,d:a.descricao||"",l:safe(a.link),c:a.cor||"#0b6bff",v:br(a.vencimento)}});draw()}).catch(function(){})}
function focusAd(a){var r=cv.getBoundingClientRect(),k=Math.min(r.width*.5/(a.w*C),r.height*.5/(a.h*C));
  s=Math.min(40,Math.max(minS,k));tx=r.width/2-(a.x+B+a.w/2)*C*s;ty=r.height/2-(a.y+B+a.h/2)*C*s;clamp();draw();openSheet({x:a.x,y:a.y})}
$("sa").addEventListener("click",function(){if(curAd&&curAd.l!=="#")track(curAd.id)});
$("hot").onclick=function(){var on=$("rank").classList.toggle("on");$("hot").setAttribute("aria-expanded",on)};
if(innerWidth>=900)$("hot").onclick();
stat();fit();load(true);setInterval(function(){if(!document.hidden)load(false)},30000);
</script>
</body>
</html>
