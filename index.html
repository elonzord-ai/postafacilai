<title>Posta Fácil AI – Cubo de murais</title>
<meta name="description" content="Cubo 3D de murais com quatro triângulos em órbita. Toque numa face para abrir o mural.">
<meta name="theme-color" content="#0a1128">
<style>
/* Layout: palco 3D em tela cheia (cubo central + 4 tetraedros em órbita). Clique numa face: ela cresce até ocupar a tela e abre o mural dela. */
:root{
  --bg:#0a1128; --panel:#131f40; --ink:#e8edf8; --muted:#9aa8c7; --line:#26345c;
  --gold:#d6b36a; --violet:#6a3df0; --blue:#2f6bf0; --hl:#1bbfd8;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --dwa:.55; --bgrgb:10,17,40; --panelrgb:19,31,64; --linergb:38,52,92; --face:#060b1c; --ringc:rgba(138,164,255,.38); --g1:106,61,240; --g2:47,107,240;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
button.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff;font-weight:700}
button.primary:hover{border-color:var(--gold)}
.ai{background:linear-gradient(135deg,#2f6bf0,#8b5cf6,#1bbfd8);-webkit-background-clip:text;background-clip:text;color:transparent}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
#glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(34% 30% at 50% 52%,rgba(214,179,106,.10),transparent 70%),radial-gradient(60% 55% at 50% 52%,rgba(var(--g1),.20),rgba(var(--g2),.08) 45%,transparent 72%)}

header{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;background:linear-gradient(180deg,rgba(var(--bgrgb),.92),rgba(var(--bgrgb),0));pointer-events:none;transition:opacity .4s}
header>*{pointer-events:auto}
h1{display:flex;align-items:center;gap:8px;margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.logo{height:30px;width:auto}
.stat{flex:1;min-width:170px;color:var(--muted);font-size:13px;line-height:1.35;pointer-events:none}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.spd{flex:0 1 240px;min-width:150px;display:flex;align-items:center;gap:10px;height:36px;touch-action:none;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none}
.spd-track{position:relative;flex:1;height:36px}
.spd-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:var(--line)}
.spd-fill{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--violet));width:30%}
.spd-knob{position:absolute;top:50%;left:30%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,var(--gold) 55%,#8a6a2a);box-shadow:0 0 0 2px rgba(var(--bgrgb),.9),0 2px 10px rgba(214,179,106,.45);transition:transform .12s}
.spd.drag .spd-knob{transform:scale(1.2)}
.spd:focus-visible .spd-knob{outline:2px solid var(--hl);outline-offset:3px}
.spd-v{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage.drag{cursor:grabbing}
#scene,#plane,#cubeG,.orb,.tet{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--face);transition:opacity .6s}
.face canvas{display:block;width:100%;height:100%}
.face.dim{opacity:0}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 38%,transparent 62%,rgba(0,0,0,.16));box-shadow:inset 0 0 0 1px rgba(214,179,106,.3),inset 0 0 38px rgba(0,0,0,.28)}
@keyframes glw{0%,100%{opacity:.75}50%{opacity:1}}
#glow{animation:glw 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#glow{animation:none}}
.ring{position:absolute;border:1px dashed var(--ringc);border-radius:50%;pointer-events:none;transition:opacity .6s}
.ring.r2{border-color:rgba(46,229,157,.16)}
.ring.dim{opacity:0}

/* aba lateral (puxador) */
#dw{position:fixed;z-index:8;right:0;top:62px;bottom:14px;width:min(50vw,640px);min-width:min(360px,94vw);transform:translateX(100%);transition:transform .45s cubic-bezier(.22,.8,.24,1),opacity .3s}
#dw.open{transform:none}
#dw.off{opacity:0;pointer-events:none}
#dwh{position:absolute;left:-40px;top:50%;margin-top:-62px;width:40px;height:124px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:14px 0 0 14px;border:1px solid rgba(214,179,106,.7);border-right:0;
  background:linear-gradient(180deg,rgba(47,107,240,.55),rgba(106,61,240,.6)),var(--panel);color:#fff3cf;box-shadow:-6px 0 22px rgba(0,0,0,.4),0 0 18px rgba(106,61,240,.4)}
#dwh .dwt{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:12.5px;letter-spacing:1.4px;text-transform:uppercase}
#dwh .dwi{font-size:18px;line-height:1;transition:transform .35s}
#dw.open #dwh .dwi{transform:rotate(180deg)}
#dwp{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:16px 0 0 16px;border:1px solid rgba(214,179,106,.45);border-right:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(var(--panelrgb),.97),rgba(var(--bgrgb),.98));box-shadow:-14px 0 40px rgba(0,0,0,var(--dwa))}
.dwtop{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.dwtop h2{margin:0;font-size:17px;flex:1}
.dwtop button{min-height:32px;padding:2px 10px}
.dwbody{flex:1;overflow-y:auto;padding:0 16px 18px;overscroll-behavior:contain;touch-action:pan-y}
.dwst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dwst div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(var(--linergb),.28)}
.dwst b{display:block;font-size:17px;color:var(--gold)}.dwst span{font-size:11.5px;color:var(--muted)}
#dwq{width:100%;margin-bottom:6px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--bgrgb),.7);color:var(--ink);font:inherit;font-size:14px}
#dwq:focus{outline:2px solid var(--hl);outline-offset:1px}
.dwsec{margin:14px 0 8px;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dwsec::after{content:"";flex:1;height:1px;background:var(--line)}
.dwg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.dwc{display:flex;flex-direction:column;gap:5px;text-align:left;padding:7px;border-radius:10px;min-height:0;background:rgba(var(--linergb),.25);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.dwc:hover{transform:translateY(-2px);border-color:var(--gold)}
.dwc canvas{width:100%;display:block;border-radius:6px;background:var(--bg)}
.dwc.tri canvas{clip-path:polygon(50% 0,100% 100%,0 100%);aspect-ratio:1.155;background:transparent}
.dwc .n{font-size:12.5px;font-weight:700;line-height:1.2}
.dwc .m{font-size:11px;color:var(--muted);line-height:1.25}
.dwc .bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}.dwc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--hl))}
.dwgrp{margin-bottom:12px}.dwgrp>h3{margin:0 0 6px;font-size:13px;color:var(--gold)}
@media(max-width:700px){#dw{width:94vw;top:100px}#dwh{width:36px;left:-36px}}
.face.pulse{animation:fp 1.1s ease-in-out 3}
@keyframes fp{0%,100%{filter:brightness(1)}40%{filter:brightness(2) saturate(1.4)}}
#toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,12px);z-index:30;padding:8px 16px;border-radius:999px;background:rgba(var(--panelrgb),.95);border:1px solid var(--gold);color:var(--ink);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.dwcw{position:relative}.dwcw .dwc{width:100%;height:100%}
#lockd{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,9,22,.7);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#lockd[hidden]{display:none}
.lkb{max-width:380px;text-align:center;padding:26px 24px 22px;border-radius:16px;background:linear-gradient(180deg,#16244a,#0e1733);border:1px solid rgba(214,179,106,.7);box-shadow:0 18px 60px rgba(0,0,0,.6)}
.lki{font-size:44px;line-height:1}.lkb h3{margin:10px 0 6px;font-size:19px;color:var(--gold)}.lkb p{margin:0 0 18px;color:var(--muted);line-height:1.5;font-size:14px}
.cp{position:absolute;top:11px;right:11px;min-height:0;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;line-height:1;background:rgba(var(--bgrgb),.8);opacity:.85}
.cp:hover{opacity:1;border-color:var(--gold)}
.nv{position:absolute;top:12px;left:12px;font-style:normal;font-weight:800;font-size:10px;letter-spacing:.8px;padding:2px 7px;border-radius:999px;background:#2ee59d;color:#06241a;box-shadow:0 0 10px rgba(46,229,157,.6)}
.mbrow{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 10px}.mbrow.on{display:flex}
.mbrow input{flex:1;min-width:140px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(var(--bgrgb),.7);color:var(--ink);font:inherit;font-size:14px}
#mbm{flex:1 1 100%;font-size:12px;color:var(--muted);min-height:0}#mbm:empty{display:none}
#tip{position:fixed;z-index:6;display:none;pointer-events:none;padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#tip b{color:var(--gold)}#tip small{display:block;color:var(--muted);font-size:11.5px}

#hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;max-width:calc(100% - 32px);padding:7px 14px;border-radius:999px;background:rgba(var(--panelrgb),.82);border:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center;pointer-events:none;transition:opacity .4s}
#hint b{color:var(--ink);font-weight:700}
body.opening header,body.opening #hint{opacity:0}
body.opening #stage{cursor:progress}
#big{position:fixed;z-index:15;pointer-events:none;opacity:0;transition:opacity .25s;overflow:hidden}
#big.on{opacity:1}
#big canvas{display:block;width:100%;height:100%}
#fade{position:fixed;inset:0;z-index:20;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}

@media (max-width:700px){
  h1{font-size:17px}.logo{height:26px}
  .stat{flex:1 1 100%;order:3;min-width:0;font-size:12px}
  .btns{margin-left:auto}
  .spd{flex:1 1 100%;order:4}
  #hint{font-size:12px}
}
</style>

    var x0=c[0]-sb/2,yTop=I[0][1],yBot=I[1][1],cols=Math.ceil(sb/C),rows=Math.ceil((yBot-yTop)/C),n=0;

    return{sb:sb,S:S,Hh:Hh,O:O,I:I,c:c,x0:x0,yTop:yTop,yBot:yBot,n:n}}

  for(var s=110;s<=150;s=Math.round((s+.05)*100)/100){var g=geom(s);if(!best||Math.abs(g.n-7000)<Math.abs(best.n-7000))best=g;if(g.n===7000)break}

  if(!fly||a.ph===0){p=Math.min(1,(now-a.t0)/a.dur);e=ease3(p);a.e=e;
    if(p>=.9)$("big").classList.add("on");
    if(p>=1){if(!fly){if(!a.done){a.done=true;$("fade").classList.add("on");setTimeout(function(){location.href=a.link},300)}}else{a.ph=1;a.t1=now}}}
  else if(a.ph===1){e=1;a.e=1;if(now-a.t1>=a.hold){a.ph=2;a.t2=now;a.e2=1;beginRet()}}
  else{p=Math.min(1,(now-a.t2)/900);e=a.e2*(1-ease3(p));if(p>=1){endFly();return}}
  var R=mFromQ(slerp(a.q0,a.q1,e)),z=a.z0*sh.ds*(1-e)+a.z1*e;
  scene.style.transform="scale3d("+z+","+z+","+z+") matrix3d("+[R[0][0],R[1][0],R[2][0],0,R[0][1],R[1][1],R[2][1],0,R[0][2],R[1][2],R[2][2],0,0,0,0,1].join(",")+") translate3d("+(-a.c[0]*e)+"px,"+(-a.c[1]*e)+"px,"+(-a.c[2]*e)+"px)"}
function resetAfterBack(){
  anim=null;$("big").className="";$("big").innerHTML="";document.body.classList.remove("opening");$("fade").classList.remove("on");
  FACES.forEach(function(o){o.el.classList.remove("dim")});ring1.classList.remove("dim");ring2.classList.remove("dim");
  setRun(!reduce);last=performance.now();update(tt)}
window.addEventListener("pageshow",function(e){if(e.persisted||anim)resetAfterBack()});

// ---- interação: arrastar gira a vista, toque numa face abre o mural, toque no fundo pausa/gira ----
var ptr={},down=null,pinchD=0,pinchZ=1;
function faceOf(t){var e=t&&t.closest?t.closest(".face"):null;return e?FACES[+e.dataset.i]:null}
stage.addEventListener("pointerdown",function(e){
  if(anim)return;
  ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptr);
  if(ids.length===1)down={x:e.clientX,y:e.clientY,yaw:yaw,pitch:pitch,moved:false,face:faceOf(e.target)};
  else if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];pinchD=Math.hypot(a.x-b.x,a.y-b.y);pinchZ=zoom;if(down)down.moved=true}});
window.addEventListener("pointermove",function(e){
  if(!ptr[e.pointerId])return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptr);
  if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];setZoom(pinchZ*Math.hypot(a.x-b.x,a.y-b.y)/pinchD);return}
  if(down&&ids.length===1){var dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!down.moved&&Math.abs(dx)+Math.abs(dy)>8){down.moved=true;stage.classList.add("drag");$("tip").style.display="none"}
    if(down.moved){yaw=down.yaw+dx*.35;pitch=Math.max(-70,Math.min(70,down.pitch-dy*.3));if(spd===0)update(tt)}}});
function endPtr(e,cancel){
  if(!ptr[e.pointerId])return;delete ptr[e.pointerId];stage.classList.remove("drag");
  if(Object.keys(ptr).length||!down)return;var d=down;down=null;
  if(cancel||d.moved||anim)return;
  if(d.face)openFace(d.face);else toggleRun()}
$("lko").addEventListener("click",function(){$("lockd").hidden=true});
$("lockd").addEventListener("pointerdown",function(e){if(e.target===this)this.hidden=true});
addEventListener("keydown",function(e){if(e.key==="Escape")$("lockd").hidden=true});
window.addEventListener("pointerup",function(e){endPtr(e,false)});
window.addEventListener("pointercancel",function(e){endPtr(e,true)});
// dica ao passar o mouse sobre uma face
var tip=$("tip");
stage.addEventListener("pointermove",function(e){
  if(e.pointerType==="touch"||down||anim){return}
  var f=faceOf(e.target);stage.style.cursor=f?"pointer":"";
  if(!f){tip.style.display="none";return}
  tip.innerHTML="<b>"+nameOf(f)+"</b><small>"+(isLocked(f.idx)?"🔒 bloqueada · em breve":brl(f.blocks)+" blocos · clique para abrir o mural")+"</small>";
  tip.style.display="block";
  var l=e.clientX+16,tp=e.clientY+18;if(l+tip.offsetWidth>innerWidth-8)l=e.clientX-16-tip.offsetWidth;if(tp+tip.offsetHeight>innerHeight-8)tp=e.clientY-18-tip.offsetHeight;
  tip.style.left=Math.max(8,l)+"px";tip.style.top=Math.max(8,tp)+"px"});
stage.addEventListener("pointerleave",function(){tip.style.display="none"});
function setZoom(z){zoom=Math.max(.45,Math.min(4,z));if(spd===0&&!anim)update(tt)}
stage.addEventListener("wheel",function(e){e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.0015))},{passive:false});
$("bp").onclick=toggleRun;
$("bi").onclick=function(){setZoom(zoom*1.25)};$("bo").onclick=function(){setZoom(zoom/1.25)};
$("br").onclick=function(){yaw=0;pitch=-18;zoom=1;if(!anim)update(tt)};
window.addEventListener("keydown",function(e){if(e.key===" "&&document.activeElement===document.body&&!anim){e.preventDefault();toggleRun()}});

// ---- fundo estrelado ----
var sky=$("sky"),sg=sky.getContext("2d");
function drawSky(){var dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;sky.width=w*dpr;sky.height=h*dpr;sg.setTransform(dpr,0,0,dpr,0,0);
  var s=7;function rnd(){s=(s*16807)%2147483647;return s/2147483647}
  for(var i=0;i<170;i++){var x=rnd()*w,y=rnd()*h,r=rnd()*1.2+.25;sg.globalAlpha=.25+rnd()*.55;sg.fillStyle=rnd()>.8?COL.st2:COL.st1;sg.beginPath();sg.arc(x,y,r,0,6.2832);sg.fill()}sg.globalAlpha=1}
function relayout(){drawSky();layout()}
if(window.ResizeObserver)new ResizeObserver(function(){relayout()}).observe(stage);else addEventListener("resize",relayout);
setInterval(function(){if(!document.hidden&&DATA.disp)paint(cube[0])},1000);
relayout();requestAnimationFrame(frame);
loadData();setInterval(function(){if(!document.hidden)loadData()},30000);
function retema(t){if(t===temaAtual)return;setTema(t);drawSky();FACES.forEach(paint);if(typeof paintDw==="function")paintDw()}
addEventListener("storage",function(e){if(e.key==="pf_tema")retema(lerTema())});
addEventListener("pageshow",function(){retema(lerTema())});
document.addEventListener("visibilitychange",function(){if(!document.hidden)retema(lerTema())});
window.__pf={tema:function(t){try{localStorage.setItem("pf_tema",t)}catch(e){}retema(t)},FACES:FACES,TRI:TRI,DATA:DATA,pulse:pulse,flyTo:flyTo,openFace:openFace,state:function(){return{target:target,spd:spd,tt:tt,yaw:yaw,pitch:pitch,zoom:zoom,u:u,anim:!!anim}}};
})();
