<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Posta Fácil 3D</title>
<style>
/* Layout: palco 3D em tela cheia (cubo central + 4 tetraedros em órbita) com barra fina no topo e visualizador 2D do mural por face. */
:root{
  --bg:#0a1128; --bg-deep:#060b1c; --panel:#131f40; --slot:#101b3a; --board:#111a35;
  --ink:#e8edf8; --muted:#9aa8c7; --line:#26345c;
  --gold:#d6b36a; --ok:#2ee59d; --hl:#1bbfd8; --violet:#6a3df0; --blue:#2f6bf0;
  --gb:linear-gradient(135deg,rgba(214,179,106,.7),rgba(106,61,240,.45) 55%,rgba(27,191,216,.45));
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--gold)}
button:focus-visible,a:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
button.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff;font-weight:700}
button.primary:hover{border-color:var(--gold)}
.ai{background:linear-gradient(135deg,#2f6bf0,#8b5cf6,#1bbfd8);-webkit-background-clip:text;background-clip:text;color:transparent}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
#glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 50% 52%,rgba(106,61,240,.20),rgba(47,107,240,.08) 45%,transparent 72%)}

header{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 16px;background:linear-gradient(180deg,rgba(10,17,40,.92),rgba(10,17,40,0));pointer-events:none}
header>*{pointer-events:auto}
h1{display:flex;align-items:center;gap:8px;margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.logo{height:30px;width:auto}
.stat{flex:1;min-width:200px;color:var(--muted);font-size:13px;line-height:1.35;pointer-events:none}
.btns{display:flex;gap:6px;flex-wrap:wrap}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage.drag{cursor:grabbing}
#scene,#plane,#cubeG,.orb,.tet{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#scene{will-change:transform}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#060b1c}
.face canvas{display:block;width:100%;height:100%}
.ring{position:absolute;border:1px dashed rgba(138,164,255,.38);border-radius:50%;pointer-events:none}
.ring.r2{border-color:rgba(46,229,157,.16)}

#hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;max-width:calc(100% - 32px);padding:7px 14px;border-radius:999px;background:rgba(19,31,64,.82);border:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center;pointer-events:none}
#hint b{color:var(--ink);font-weight:700}

/* Visualizador 2D da face */
#vw{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#vw.on{display:flex}
#vbar{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
#vt{flex:1;min-width:180px}
#vt b{display:block;font-size:16px}
#vt small{color:var(--muted);font-size:12.5px}
#vmain{flex:1;min-height:0;position:relative;margin:0 16px 16px;border:1px solid transparent;border-radius:16px;background:linear-gradient(var(--board),var(--board)) padding-box,var(--gb) border-box;box-shadow:0 10px 34px rgba(0,0,0,.3);overflow:hidden}
#vc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sheet{position:absolute;z-index:6;left:12px;bottom:12px;width:min(360px,calc(100% - 24px));max-height:72%;overflow:auto;display:none;padding:14px;border-radius:12px;border:1px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--gb) border-box;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#sheet.on{display:block}
#sheet h2{margin:0 0 4px;font-size:17px}
#sheet p{margin:4px 0 12px;color:var(--muted);font-size:14px;line-height:1.45}
#sheet .row{display:flex;gap:8px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid transparent;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-weight:700;font-size:15px;text-decoration:none}
a.btn:hover{border-color:var(--gold)}

@media (max-width:700px){
  h1{font-size:17px}.logo{height:26px}
  .stat{flex:1 1 100%;order:3;min-width:0;font-size:12px}
  .btns{margin-left:auto}
  #hint{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<script>
(function(){
"use strict";
// ===== CONFIGURAÇÃO (edite aqui) =====

// ===== FIM DA CONFIGURAÇÃO =====
var C=10,N=100,B=8,T=N+2*B;              // mesma grade do mural original: 100x100 blocos, moldura de 8
var COL={frame:"#060b1c",board:"#111a35",slot:"#101b3a",grid:"#1c2a50",gold:"#d6b36a",ok:"#2ee59d",hl:"#1bbfd8",hl2:"#6a3df0",muted:"#9aa8c7"};

var TEX=matchMedia("(pointer:coarse)").matches?768:1024;
var SQ3=Math.sqrt(3);
var $=function(i){return document.getElementById(i)};
function pad(n,l){return String(n).padStart(l,"0")}
function brl(n){return n.toLocaleString("pt-BR")}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function lerp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function inPoly(p,x,y){var s=0;for(var i=0;i<p.length;i++){var a=p[i],b=p[(i+1)%p.length],c=(b[0]-a[0])*(y-a[1])-(b[1]-a[1])*(x-a[0]);if(c===0)continue;var sg=c>0?1:-1;if(!s)s=sg;else if(s!==sg)return false}return true}

// Leilão de demonstração da Placa 1 (a face principal): relógio local, sem servidor.
var AUCTION_END=Date.now()+((29*3600)+(22*60)+58)*1000;
function fmtT(ms){ms=Math.max(0,Math.floor(ms/1000));var d=Math.floor(ms/86400),h=Math.floor(ms%86400/3600),m=Math.floor(ms%3600/60),s=ms%60;return(d?d+"d ":"")+pad(h,2)+":"+pad(m,2)+":"+pad(s,2)}

// ---- peças de desenho compartilhadas ----
function plateLabel(ctx,sc,cx,cy,rot,L,M,text,timer){
  var fs=Math.min(M*.4,L*.9/(text.length*.62),28);if(fs*sc<4)return;
  ctx.save();ctx.translate(cx,cy);if(rot)ctx.rotate(rot);
  ctx.fillStyle=COL.gold;ctx.font="700 "+fs+"px "+FONT;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(text,0,timer?-M*.17:0);
  if(timer){ctx.font="700 "+Math.min(M*.3,24)+"px 'Courier New',monospace";ctx.fillStyle="#7b869c";ctx.fillText(timer,0,M*.22)}
  ctx.restore()}
function callout(ctx,sc,cx,cy,w,h){
  ctx.save();ctx.translate(cx,cy);
  rrect(ctx,-w/2,-h/2,w,h,h*.22);ctx.fillStyle="rgba(46,229,157,.12)";ctx.fill();
  ctx.setLineDash([h*.1,h*.07]);ctx.lineWidth=Math.max(2,h*.03);ctx.strokeStyle=COL.ok;ctx.stroke();ctx.setLineDash([]);
  if(sc*h>=30){ctx.fillStyle=COL.ok;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="700 "+(h*.42)+"px "+FONT;ctx.fillText("Seu achadinho aqui",0,-h*.13);
    ctx.font="700 "+(h*.22)+"px "+FONT;ctx.fillText("Toque num bloco · R$ "+CFG.preco+"/mês",0,h*.26)}
  ctx.restore()}
function caption(ctx,sc,cx,cy,text,main){
  if(sc*(main?26:18)<5)return;
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  if("letterSpacing" in ctx)ctx.letterSpacing=main?"4px":"3px";
  ctx.font="800 "+(main?26:18)+"px "+FONT;ctx.fillStyle=main?COL.gold:"rgba(154,168,199,.55)";ctx.fillText(text,cx,cy);ctx.restore()}

// ---- face quadrada (cubo): 100x100 blocos + 12 placas na moldura ----
function makeSq(idx,label,main){
  var W=T*C,slots=[],id=1,i;
  function add(x,y,w,h){slots.push({id:id++,x:x*C,y:y*C,w:w*C,h:h*C,v:h>w,price:id-1<=4?CFG.precoTopo:CFG.precoLados})}
  for(i=0;i<4;i++)add(i*T/4,0,T/4,B);
  add(N+B,B,B,N/2);add(N+B,B+N/2,B,N/2);
  for(i=0;i<4;i++)add(i*T/4,N+B,T/4,B);
  add(0,B,B,N/2);add(0,B+N/2,B,N/2);
  var f={kind:"sq",idx:idx,label:label,main:main,W:W,H:W,blocks:N*N,slots:slots};
  f.draw=function(ctx,sc,st){
    var hv=st&&st.hover;
    ctx.fillStyle=COL.frame;ctx.fillRect(0,0,W,W);
    slots.forEach(function(q){
      ctx.fillStyle=COL.slot;ctx.fillRect(q.x+2,q.y+2,q.w-4,q.h-4);
      ctx.strokeStyle=COL.gold;ctx.globalAlpha=.45;ctx.lineWidth=2;ctx.strokeRect(q.x+3,q.y+3,q.w-6,q.h-6);ctx.globalAlpha=1;
      var auc=main&&q.id===1,L=q.v?q.h:q.w,M=q.v?q.w:q.h,txt="Placa "+q.id+" · "+(auc?"disputa de lances":"disponível");
      plateLabel(ctx,sc,q.x+q.w/2,q.y+q.h/2,q.v?-Math.PI/2:0,L,M,txt,auc?fmtT(AUCTION_END-Date.now()):null);
      if(hv&&hv.sl===q){ctx.strokeStyle=COL.hl2;ctx.lineWidth=3/sc;ctx.strokeRect(q.x+2,q.y+2,q.w-4,q.h-4)}});
    ctx.save();ctx.translate(B*C,B*C);
    ctx.fillStyle=COL.board;ctx.fillRect(0,0,N*C,N*C);
    if(sc*C>=4){ctx.strokeStyle=COL.grid;ctx.lineWidth=1/sc;ctx.beginPath();
      for(var k=0;k<=N;k++){ctx.moveTo(k*C,0);ctx.lineTo(k*C,N*C);ctx.moveTo(0,k*C);ctx.lineTo(N*C,k*C)}ctx.stroke()}
    caption(ctx,sc,N*C/2,36,main?CFG.nomeFace0.toUpperCase():label.toUpperCase(),main);
    callout(ctx,sc,N*C/2,N*C/2,520,112);
    if(hv&&hv.cell){ctx.globalAlpha=.25;ctx.fillStyle=COL.hl2;ctx.fillRect(hv.cell.x*C,hv.cell.y*C,C,C);ctx.globalAlpha=1;ctx.strokeStyle=COL.hl2;ctx.lineWidth=2/sc;ctx.strokeRect(hv.cell.x*C,hv.cell.y*C,C,C)}
    ctx.restore();
    ctx.strokeStyle=COL.gold;ctx.globalAlpha=.6;ctx.lineWidth=4;ctx.strokeRect(2,2,W-4,W-4);ctx.globalAlpha=1};
  f.hit=function(x,y){
    var cx=Math.floor(x/C)-B,cy=Math.floor(y/C)-B;
    if(cx>=0&&cy>=0&&cx<N&&cy<N)return{cell:{x:cx,y:cy,num:cy*N+cx+1}};
    for(var k=0;k<slots.length;k++){var q=slots[k];if(x>=q.x&&x<q.x+q.w&&y>=q.y&&y<q.y+q.h)return{sl:q}}
    return null};
  f.num=function(c){return"#"+pad(c.num,5)};
  return f}

// ---- face triangular (tetraedro): ~7 mil blocos + 6 placas nas 3 bordas ----
var TRI=(function(){
  var w=B*C;
  function geom(sbBlocks){
    var sb=sbBlocks*C,rin=sb/(2*SQ3),rout=rin+w,S=2*SQ3*rout,Hh=S*SQ3/2;
    var O=[[S/2,0],[S,Hh],[0,Hh]],c=[S/2,Hh*2/3],k=rin/rout;
    var I=O.map(function(p){return[c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k]});
    var x0=c[0]-sb/2,yTop=I[0][1],yBot=I[1][1],cols=Math.ceil(sb/C),rows=Math.ceil((yBot-yTop)/C);
    var num=new Int32Array(cols*rows),n=0;
    for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
      var px=x0+(i+.5)*C,py=yTop+(j+.5)*C;
      if(py<=yBot&&Math.abs(px-c[0])<=(py-yTop)/SQ3)num[j*cols+i]=++n}
    return{sb:sb,S:S,Hh:Hh,O:O,I:I,c:c,x0:x0,yTop:yTop,yBot:yBot,cols:cols,rows:rows,num:num,n:n}}
  var best=null;
  for(var s=110;s<=150;s=Math.round((s+.05)*100)/100){var g=geom(s);if(!best||Math.abs(g.n-7000)<Math.abs(best.n-7000))best=g;if(g.n===7000)break}
  return best})();

function makeTri(idx,label){
  var G=TRI,S=G.S,Hh=G.Hh,plates=[],id=1,e,kk;
  for(e=0;e<3;e++){var Oa=G.O[e],Ob=G.O[(e+1)%3],Ia=G.I[e],Ib=G.I[(e+1)%3];
    var ang=Math.atan2(Ob[1]-Oa[1],Ob[0]-Oa[0]);if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
    for(kk=0;kk<2;kk++){var t0=kk/2,t1=(kk+1)/2,poly=[lerp(Oa,Ob,t0),lerp(Oa,Ob,t1),lerp(Ia,Ib,t1),lerp(Ia,Ib,t0)];
      var cx=0,cy=0;poly.forEach(function(p){cx+=p[0]/4;cy+=p[1]/4});
      plates.push({id:id++,poly:poly,cx:cx,cy:cy,ang:ang,L:Math.hypot(Ob[0]-Oa[0],Ob[1]-Oa[1])/2,price:CFG.precoPlacaTri})}}
  var f={kind:"tri",idx:idx,label:label,W:S,H:Hh,blocks:G.n,slots:plates};
  function path(ctx,P){ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(P[1][0],P[1][1]);ctx.lineTo(P[2][0],P[2][1]);ctx.closePath()}
  f.draw=function(ctx,sc,st){
    var hv=st&&st.hover;
    ctx.fillStyle=COL.frame;path(ctx,G.O);ctx.fill();
    // miolo com a grade
    ctx.save();path(ctx,G.I);ctx.fillStyle=COL.board;ctx.fill();ctx.clip();
    if(sc*C>=4){ctx.strokeStyle=COL.grid;ctx.lineWidth=1/sc;ctx.beginPath();
      for(var i=0;i<=G.cols;i++){ctx.moveTo(G.x0+i*C,G.yTop);ctx.lineTo(G.x0+i*C,G.yBot)}
      for(var j=0;j<=G.rows;j++){ctx.moveTo(G.x0,G.yTop+j*C);ctx.lineTo(G.x0+G.cols*C,G.yTop+j*C)}ctx.stroke()}
    caption(ctx,sc,G.c[0],G.yBot-26,label.toUpperCase(),false);
    callout(ctx,sc,G.c[0],G.c[1]+G.sb*.04,430,94);
    if(hv&&hv.cell){var h=hv.cell;ctx.globalAlpha=.25;ctx.fillStyle=COL.hl2;ctx.fillRect(G.x0+h.i*C,G.yTop+h.j*C,C,C);ctx.globalAlpha=1;ctx.strokeStyle=COL.hl2;ctx.lineWidth=2/sc;ctx.strokeRect(G.x0+h.i*C,G.yTop+h.j*C,C,C)}
    ctx.restore();
    // placas
    plates.forEach(function(q){
      ctx.beginPath();q.poly.forEach(function(p,n){n?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.closePath();
      ctx.fillStyle=COL.slot;ctx.fill();
      ctx.lineJoin="round";ctx.strokeStyle=COL.frame;ctx.lineWidth=6;ctx.stroke();
      ctx.strokeStyle=COL.gold;ctx.globalAlpha=.5;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
      plateLabel(ctx,sc,q.cx,q.cy,q.ang,q.L,B*C,"Placa "+q.id+" · disponível",null);
      if(hv&&hv.sl===q){ctx.strokeStyle=COL.hl2;ctx.lineWidth=3/sc;ctx.stroke()}});
    // contorno dourado externo
    ctx.lineJoin="miter";ctx.strokeStyle=COL.gold;ctx.globalAlpha=.55;ctx.lineWidth=3;path(ctx,G.O);ctx.stroke();ctx.globalAlpha=1};
  f.hit=function(x,y){
    for(var k=0;k<plates.length;k++)if(inPoly(plates[k].poly,x,y))return{sl:plates[k]};
    var i=Math.floor((x-G.x0)/C),j=Math.floor((y-G.yTop)/C);
    if(i>=0&&j>=0&&i<G.cols&&j<G.rows){var n=G.num[j*G.cols+i];if(n)return{cell:{i:i,j:j,num:n}}}
    return null};
  f.num=function(c){return"#"+pad(c.num,4)};
  return f}

// ---- montagem das faces ----
var FACES=[],cube=[],tets=[],K=0;
cube.push(makeSq(K++,"Cubo · face 1",true));
for(var q=2;q<=6;q++)cube.push(makeSq(K++,"Cubo · face "+q,false));
var LET=["A","B","C","D"];
for(var t=0;t<4;t++){var fs=[];["lado 1","lado 2","lado 3","base"].forEach(function(n){fs.push(makeTri(K++,"Triângulo "+LET[t]+" · "+n))});tets.push(fs)}
FACES=cube.slice();tets.forEach(function(fs){fs.forEach(function(f){FACES.push(f)})});

var triN=TRI.n;
$("stat").textContent=brl(6*N*N)+" blocos no cubo · "+"16 faces triangulares de ~"+Math.round(triN/1000)+" mil · R$ "+CFG.preco+"/bloco por mês";

// ---- DOM 3D ----
var stage=$("stage"),scene=$("scene"),plane=$("plane"),cubeG=$("cubeG");
function mkFace(f){
  var el=document.createElement("div");el.className="face "+f.kind;el.dataset.i=f.idx;
  var cv=document.createElement("canvas"),k=TEX/f.W;cv.width=Math.round(f.W*k);cv.height=Math.round(f.H*k);
  el.appendChild(cv);f.el=el;f.cv=cv;f.ctx=cv.getContext("2d");f.k=k;return el}
function paint(f){var c=f.ctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,f.cv.width,f.cv.height);c.setTransform(f.k,0,0,f.k,0,0);f.draw(c,f.k,null)}
cube.forEach(function(f){cubeG.appendChild(mkFace(f))});
var ring1=document.createElement("div"),ring2=document.createElement("div");ring1.className="ring";ring2.className="ring r2";plane.appendChild(ring1);plane.appendChild(ring2);
var orbs=[],tetEls=[];
tets.forEach(function(fs,i){
  var orb=document.createElement("div"),tet=document.createElement("div");orb.className="orb";tet.className="tet";
  fs.forEach(function(f){tet.appendChild(mkFace(f))});orb.appendChild(tet);plane.appendChild(orb);orbs.push(orb);tetEls.push(tet)});
FACES.forEach(paint);

// geometria 3D dependente do tamanho da tela
var u=100,perspective=1200;
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function layout(){
  var w=stage.clientWidth,h=stage.clientHeight;
  var portrait=w<h*.85;u=Math.max(22,portrait?Math.min(w/8.8,h/6.5):Math.min(w/11.2,h/6.6));perspective=u*13;
  stage.style.perspective=perspective+"px";
  var E=2*u,R=(portrait?3.05:3.85)*u;
  cube.forEach(function(f,i){var s=f.el.style;s.width=s.height=E+"px";s.left=s.top=(-E/2)+"px";
    var tf=["","rotateY(90deg)","rotateY(180deg)","rotateY(-90deg)","rotateX(90deg)","rotateX(-90deg)"][i];
    s.transform=tf+" translateZ("+(E/2)+"px)"});
  [ring1,ring2].forEach(function(r,i){var rr=R*(i?1.22:1);r.style.width=r.style.height=(2*rr)+"px";r.style.left=r.style.top=(-rr)+"px";r.style.transform="rotateX(90deg)"});
  // tetraedro regular (coordenadas CSS: y para baixo), vértice no topo
  var Rt=1.15*u,A=[0,-Rt,0],rho=Rt*Math.sqrt(8)/3,V=[0,1,2].map(function(k){var a=(k*120+30)*Math.PI/180;return[rho*Math.cos(a),Rt/3,rho*Math.sin(a)]});
  var a=Rt*Math.sqrt(8/3),hh=a*SQ3/2;
  var defs=[[V[0],V[1],V[2]],[A,V[0],V[1]],[A,V[1],V[2]],[A,V[2],V[0]]];
  tets.forEach(function(fs){fs.forEach(function(f,n){
    var d=defs[n===3?0:n+1],P0=d[0],P1=d[1],P2=d[2],cen=[(P0[0]+P1[0]+P2[0])/3,(P0[1]+P1[1]+P2[1])/3,(P0[2]+P1[2]+P2[2])/3];
    function build(P1,P2){var ex=sub(P1,P2).map(function(x){return x/a}),mid=[(P1[0]+P2[0])/2,(P1[1]+P2[1])/2,(P1[2]+P2[2])/2],ey=sub(mid,P0).map(function(x){return x/hh});return{ex:ex,ey:ey,ez:cross(ex,ey)}}
    var m=build(P1,P2);if(dot(m.ez,cen)<0)m=build(P2,P1);
    var o=[P0[0]-m.ex[0]*a/2,P0[1]-m.ex[1]*a/2,P0[2]-m.ex[2]*a/2],s=f.el.style;
    s.left=s.top="0px";s.width=a+"px";s.height=hh+"px";s.transformOrigin="0 0";
    s.clipPath="polygon(50% 0,100% 100%,0 100%)";
    s.transform="matrix3d("+[m.ex[0],m.ex[1],m.ex[2],0,m.ey[0],m.ey[1],m.ey[2],0,m.ez[0],m.ez[1],m.ez[2],0,o[0],o[1],o[2],1].map(function(x){return+x.toFixed(6)}).join(",")+")"})});
  stage._R=R;
  update(tt)}

// ---- animação ----
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
var target=reduce?0:1,spd=target,tt=0,last=performance.now();
var yaw=0,pitch=-18,zoom=1;
function update(t){
  var R=stage._R||3.85*u;
  cubeG.style.transform="translateY("+(Math.sin(t*.9)*.12*u)+"px) rotateZ(5deg) rotateY("+(-t*20)+"deg)";
  plane.style.transform="rotateX(8deg) rotateZ(-6deg)";
  for(var i=0;i<4;i++){
    orbs[i].style.transform="rotateY("+(i*90-t*26)+"deg) translateZ("+R+"px)";
    tetEls[i].style.transform="translateY("+(Math.sin(t*1.1+i*1.7)*.2*u)+"px) rotateY("+(-t*48)+"deg) rotateZ("+(Math.sin(t*.7+i)*14)+"deg)"}
  scene.style.transform="scale("+zoom+") rotateX("+pitch+"deg) rotateY("+yaw+"deg)"}
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  spd+=(target-spd)*Math.min(1,dt*9);if(Math.abs(target-spd)<.001)spd=target;
  tt+=dt*spd;if(!VS.on)update(tt);
  requestAnimationFrame(frame)}
function setRun(run){target=run?1:0;$("bp").textContent=run?"Pausar":"Girar";$("bp").setAttribute("aria-pressed",run?"false":"true")}
setRun(!reduce);

// ---- interação no palco (arrastar gira a vista; toque pausa; duplo toque abre a face) ----
var ptr={},down=null,lastTap=null,pinchD=0,pinchZ=1;
function faceOf(t){var e=t&&t.closest?t.closest(".face"):null;return e?FACES[+e.dataset.i]:null}
stage.addEventListener("pointerdown",function(e){
  ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptr);
  if(ids.length===1)down={x:e.clientX,y:e.clientY,yaw:yaw,pitch:pitch,moved:false,face:faceOf(e.target)};
  else if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];pinchD=Math.hypot(a.x-b.x,a.y-b.y);pinchZ=zoom;if(down)down.moved=true}});
window.addEventListener("pointermove",function(e){
  if(!ptr[e.pointerId])return;ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(ptr);
  if(ids.length===2){var a=ptr[ids[0]],b=ptr[ids[1]];setZoom(pinchZ*Math.hypot(a.x-b.x,a.y-b.y)/pinchD);return}
  if(down&&ids.length===1){var dx=e.clientX-down.x,dy=e.clientY-down.y;
    if(!down.moved&&Math.abs(dx)+Math.abs(dy)>8){down.moved=true;stage.classList.add("drag")}
    if(down.moved){yaw=down.yaw+dx*.35;pitch=Math.max(-70,Math.min(70,down.pitch-dy*.3));if(spd===0)update(tt)}}});
function endPtr(e,cancel){
  if(!ptr[e.pointerId])return;delete ptr[e.pointerId];stage.classList.remove("drag");
  if(Object.keys(ptr).length||!down)return;var d=down;down=null;
  if(cancel||d.moved)return;
  var now=performance.now();
  if(lastTap&&now-lastTap.t<380&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30){
    // segundo toque: desfaz o primeiro e abre o mural da face tocada
    setRun(lastTap.was);lastTap=null;var f=d.face||faceOf(document.elementFromPoint(e.clientX,e.clientY));if(f)openViewer(f);return}
  lastTap={t:now,x:e.clientX,y:e.clientY,was:target===1};
  setRun(target!==1)}
window.addEventListener("pointerup",function(e){endPtr(e,false)});
window.addEventListener("pointercancel",function(e){endPtr(e,true)});
function setZoom(z){zoom=Math.max(.45,Math.min(4,z));if(spd===0)update(tt)}
stage.addEventListener("wheel",function(e){e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.0015))},{passive:false});
$("bp").onclick=function(){setRun(target!==1)};
$("bi").onclick=function(){setZoom(zoom*1.25)};$("bo").onclick=function(){setZoom(zoom/1.25)};
$("br").onclick=function(){yaw=0;pitch=-18;zoom=1;update(tt)};
window.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&VS.on)closeViewer();
  else if(e.key===" "&&!VS.on&&document.activeElement===document.body){e.preventDefault();setRun(target!==1)}});

// ---- visualizador 2D (o mural original, com zoom e cliques) ----
var vw=$("vw"),vc=$("vc"),vx=vc.getContext("2d"),VS={on:false,f:null,s:1,tx:0,ty:0,minS:.2,dpr:1,hover:null,pts:{},drag:null,pinch:null};
function vRect(){return vc.getBoundingClientRect()}
function vFit(){var r=vRect(),f=VS.f;if(!f||!r.width)return;VS.dpr=window.devicePixelRatio||1;vc.width=Math.round(r.width*VS.dpr);vc.height=Math.round(r.height*VS.dpr);
  VS.minS=Math.min(r.width/f.W,r.height/f.H)*.97;VS.s=VS.minS;VS.tx=(r.width-f.W*VS.s)/2;VS.ty=(r.height-f.H*VS.s)/2;vDraw()}
function vClamp(){var r=vRect(),f=VS.f,w=f.W*VS.s,h=f.H*VS.s;
  VS.tx=w<r.width?(r.width-w)/2:Math.min(0,Math.max(r.width-w,VS.tx));VS.ty=h<r.height?(r.height-h)/2:Math.min(0,Math.max(r.height-h,VS.ty))}
function vDraw(){var f=VS.f;if(!f)return;vx.setTransform(1,0,0,1,0,0);vx.clearRect(0,0,vc.width,vc.height);
  vx.setTransform(VS.dpr*VS.s,0,0,VS.dpr*VS.s,VS.dpr*VS.tx,VS.dpr*VS.ty);f.draw(vx,VS.s,{hover:VS.hover})}
function vZoom(fac,px,py){var ns=Math.min(40,Math.max(VS.minS,VS.s*fac));fac=ns/VS.s;VS.tx=px-(px-VS.tx)*fac;VS.ty=py-(py-VS.ty)*fac;VS.s=ns;vClamp();vDraw()}
function vPos(e){var r=vRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function vHit(p){return VS.f.hit((p.x-VS.tx)/VS.s,(p.y-VS.ty)/VS.s)}
vc.addEventListener("pointerdown",function(e){vc.setPointerCapture(e.pointerId);VS.pts[e.pointerId]=vPos(e);var k=Object.keys(VS.pts);
  if(k.length===1)VS.drag={sx:VS.pts[k[0]].x,sy:VS.pts[k[0]].y,ox:VS.tx,oy:VS.ty,moved:false};
  else if(k.length===2){VS.drag=null;var a=VS.pts[k[0]],b=VS.pts[k[1]];VS.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:VS.s}}});
vc.addEventListener("pointermove",function(e){var p=vPos(e);if(VS.pts[e.pointerId])VS.pts[e.pointerId]=p;var k=Object.keys(VS.pts);
  if(k.length===2&&VS.pinch){var a=VS.pts[k[0]],b=VS.pts[k[1]];vZoom(VS.pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/VS.pinch.d/VS.s,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(VS.drag&&k.length===1){var dx=p.x-VS.drag.sx,dy=p.y-VS.drag.sy;if(Math.abs(dx)+Math.abs(dy)>10)VS.drag.moved=true;
    if(VS.drag.moved){VS.tx=VS.drag.ox+dx;VS.ty=VS.drag.oy+dy;vClamp();vDraw()}}
  else if(!k.length){VS.hover=vHit(p);vDraw()}});
function vUp(e){var p=vPos(e);delete VS.pts[e.pointerId];
  if(VS.drag&&!VS.drag.moved&&!VS.pinch){var h=vHit(p);if(h){VS.hover=h;vDraw();showSheet(h)}}
  if(!Object.keys(VS.pts).length){VS.drag=null;VS.pinch=null}}
vc.addEventListener("pointerup",vUp);vc.addEventListener("pointercancel",function(e){delete VS.pts[e.pointerId];VS.drag=null;VS.pinch=null});
vc.addEventListener("wheel",function(e){e.preventDefault();var p=vPos(e);vZoom(e.deltaY<0?1.15:1/1.15,p.x,p.y)},{passive:false});
function vMid(){var r=vRect();return[r.width/2,r.height/2]}
$("vi").onclick=function(){var m=vMid();vZoom(1.5,m[0],m[1])};
$("vo").onclick=function(){var m=vMid();vZoom(1/1.5,m[0],m[1])};
$("vr").onclick=vFit;
function wa(msg){return"https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent(msg)}
function showSheet(h){var f=VS.f,sa=$("sa"),sh=$("sh"),sp=$("sp");
  if(h.sl){var q=h.sl,auc=f.main&&q.id===1;
    if(auc){sh.textContent="Disputa de lances · Placa 1";
      sp.textContent="Lance mínimo R$ 500,00. O lance é um compromisso de compra, com pagamento via Pix em até 30 minutos após o fim da disputa. Termina em "+fmtT(AUCTION_END-Date.now())+" (relógio de demonstração).";
      sa.textContent="Pedir código";sa.href=wa("Quero participar da disputa de lances da placa 1 no Posta Fácil AI")}
    else{sh.textContent="Placa de patrocinador "+q.id;
      sp.textContent="Espaço master em destaque ao redor do mural, para grandes marcas. R$ "+brl(q.price)+" por semana, com renovação a cada 7 dias.";
      sa.textContent="Reservar no WhatsApp";sa.href=wa("Quero reservar a placa "+q.id+" ("+f.label+") no Posta Fácil AI")}}
  else{var n=f.num(h.cell);sh.textContent="Bloco "+n+" · livre";
    sp.textContent="Reserve este espaço por R$ "+CFG.preco+" por mês e apareça aqui com sua loja.";
    sa.textContent="Reservar no WhatsApp";sa.href=wa("Quero reservar o bloco "+n+" na "+f.label+" do mural Posta Fácil AI")}
  $("sheet").classList.add("on")}
function hideSheet(){$("sheet").classList.remove("on")}
$("sx").onclick=hideSheet;
function openViewer(f){VS.f=f;VS.on=true;VS.hover=null;hideSheet();
  $("vtt").textContent=f.main?f.label+" · "+CFG.nomeFace0:f.label;
  $("vts").textContent=brl(f.blocks)+" blocos · "+f.slots.length+" placas · arraste para mover, role ou pince para dar zoom";
  vw.classList.add("on");vFit();$("vx").focus()}
function closeViewer(){VS.on=false;VS.f=null;vw.classList.remove("on");hideSheet();last=performance.now()}
$("vx").onclick=closeViewer;

// ---- fundo estrelado ----
var sky=$("sky"),sg=sky.getContext("2d");
function drawSky(){var dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;sky.width=w*dpr;sky.height=h*dpr;sg.setTransform(dpr,0,0,dpr,0,0);
  var s=7;function rnd(){s=(s*16807)%2147483647;return s/2147483647}
  for(var i=0;i<170;i++){var x=rnd()*w,y=rnd()*h,r=rnd()*1.2+.25;sg.globalAlpha=.25+rnd()*.55;sg.fillStyle=rnd()>.8?"#8aa4ff":"#e8edf8";sg.beginPath();sg.arc(x,y,r,0,6.2832);sg.fill()}sg.globalAlpha=1}
function relayout(){drawSky();layout();if(VS.on)vFit()}
if(window.ResizeObserver)new ResizeObserver(function(){relayout()}).observe(stage);else addEventListener("resize",relayout);
setInterval(function(){if(document.hidden)return;var f=cube[0];paint(f);if(VS.on&&VS.f===f)vDraw()},1000);
relayout();requestAnimationFrame(frame);
window.__pf={FACES:FACES,TRI:TRI,openViewer:openViewer,closeViewer:closeViewer,state:function(){return{target:target,spd:spd,tt:tt,yaw:yaw,pitch:pitch,zoom:zoom,u:u}}};
})();
</script>
